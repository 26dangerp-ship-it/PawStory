<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Details | PawStory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">🐾 PawStory</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="details.html">Details</a></li>
          <li class="nav-item"><a class="nav-link" href="adopt.html">Adopt</a></li>
          <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">← Back to Browse</a>
    <div class="row g-5 align-items-center bg-white p-4 p-md-5 rounded-4 shadow-sm">
      <div class="col-md-6">
        <img id="img" class="img-fluid rounded-4 shadow-sm detail-img" alt="Pet">
      </div>
      <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h1 id="name" class="display-5 fw-bold mb-0"></h1>
          <button id="favBtn" onclick="toggleFav(petKey);syncFav()" class="btn btn-outline-danger rounded-circle fs-5">♥</button>
        </div>
        <p id="meta" class="fs-5 text-muted mb-3"></p>
        <div id="badges" class="mb-4"></div>
        <h5 class="fw-bold">About</h5>
        <p id="bio" class="text-secondary mb-4"></p>
        <div class="shelter-box p-3 rounded-3 mb-4 d-flex justify-content-between align-items-center">
          <div><small class="text-muted d-block">Listed by shelter</small><strong id="shelter"></strong></div>
          <span class="badge bg-dark">Verified</span>
        </div>
        <a id="adoptLink" class="btn btn-warm btn-lg w-100 fw-bold py-3"></a>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">🐾 PawStory – Every Pet Deserves a Loving Story | LA-II Mini Project</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="pets.js"></script>
  <script>
    document.title = `${currentPet.name} | PawStory`;
    document.getElementById("img").src = currentPet.img;
    document.getElementById("name").innerText = currentPet.name;
    document.getElementById("meta").innerText = currentPet.meta;
    document.getElementById("bio").innerText = currentPet.bio;
    document.getElementById("shelter").innerText = currentPet.shelter;
    document.getElementById("badges").innerHTML = currentPet.badges
      .map(b => `<span class="badge bg-success-subtle text-success rounded-pill px-3 py-2 me-2 mb-2">✓ ${b}</span>`).join("");
    document.getElementById("adoptLink").innerText = "Adopt " + currentPet.name;
    document.getElementById("adoptLink").href = "adopt.html?pet=" + petKey;

    function syncFav() {
      const saved = getFavs().includes(petKey);
      document.getElementById("favBtn").className = `btn ${saved ? 'btn-danger' : 'btn-outline-danger'} rounded-circle fs-5`;
    }
    syncFav();
  </script>
</body>
</html>
