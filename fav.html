<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites | PawStory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">🐾 PawStory</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="details.html">Details</a></li>
          <li class="nav-item"><a class="nav-link" href="adopt.html">Adopt</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="favorites.html">Favorites</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 720px;">
    <h1 class="fw-bold mb-1">Favorites</h1>
    <p id="sub" class="text-muted mb-4"></p>
    <div id="list" class="d-flex flex-column gap-3 mb-4"></div>
    <a href="index.html" class="btn btn-outline-dark btn-lg w-100 fw-semibold">Browse more pets</a>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">🐾 PawStory – Every Pet Deserves a Loving Story | LA-II Mini Project</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="pets.js"></script>
  <script>
    function renderFavs() {
      const favs = getFavs();
      document.getElementById("sub").innerText = `${favs.length} pets you saved on PawStory`;
      document.getElementById("list").innerHTML = favs.length ? favs.map(id => {
        const p = PETS[id];
        if (!p) return "";
        return `
          <div class="card border-0 shadow-sm p-3 rounded-4 d-flex flex-row align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <img src="${p.img}" class="saved-img" alt="${p.name}">
              <div>
                <h5 class="fw-bold mb-1">${p.name}</h5>
                <small class="text-muted">${p.meta}</small>
              </div>
            </div>
            <div class="d-flex gap-2">
              <a href="details.html?pet=${id}" class="btn btn-warm">Adopt</a>
              <button onclick="toggleFav('${id}');renderFavs()" class="btn btn-outline-secondary">✕</button>
            </div>
          </div>`;
      }).join("") : `<div class="card p-4 text-center text-muted border-0 shadow-sm rounded-4">No saved pets yet. Click ♥ on any pet to save them!</div>`;
    }
    renderFavs();
  </script>
</body>
</html>
