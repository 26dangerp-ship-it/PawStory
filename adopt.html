<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt | PawStory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">🐾 PawStory</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="details.html">Details</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="adopt.html">Adopt</a></li>
          <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5" style="max-width: 620px;">
    <a id="backBtn" class="btn btn-outline-secondary btn-sm mb-3">← Back</a>
    <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
      <span class="badge bg-warning-subtle text-dark align-self-start mb-2">Step 1 of 3 • About you</span>
      <h2 id="title" class="fw-bold mb-4"></h2>

      <form onsubmit="event.preventDefault(); new bootstrap.Modal('#doneModal').show();">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full name</label>
          <input type="text" class="form-control form-control-lg" placeholder="Enter your full name" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Phone number</label>
          <input type="tel" class="form-control form-control-lg" placeholder="+91 98765 43210" required>
        </div>
        <label id="qLabel" class="form-label fw-semibold mb-2"></label>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <input type="radio" class="btn-check" name="housing" id="h1" checked>
            <label class="btn btn-outline-dark w-100 py-3 fw-semibold" for="h1">🏡 House</label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" name="housing" id="h2">
            <label class="btn btn-outline-dark w-100 py-3 fw-semibold" for="h2">🏢 Apartment</label>
          </div>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="exp">
          <label class="form-check-label" for="exp">I have had a pet before</label>
        </div>
        <button type="submit" class="btn btn-warm btn-lg w-100 fw-bold py-3">Continue</button>
      </form>
    </div>
  </main>

  <!-- Bootstrap Confirmation Modal -->
  <div class="modal fade" id="doneModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4 rounded-4">
        <div class="fs-1 mb-2">🐾🎉</div>
        <h4 class="fw-bold">Application Submitted!</h4>
        <p class="text-muted">Your request to adopt <strong id="mPet"></strong> has been sent to <span id="mShelter"></span>.</p>
        <a href="index.html" class="btn btn-warm mt-2">Back to Home</a>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">🐾 PawStory – Every Pet Deserves a Loving Story | LA-II Mini Project</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="pets.js"></script>
  <script>
    document.getElementById("backBtn").innerText = "← Back to " + currentPet.name;
    document.getElementById("backBtn").href = "details.html?pet=" + petKey;
    document.getElementById("title").innerText = "Adopt " + currentPet.name;
    document.getElementById("qLabel").innerText = `Where will ${currentPet.name} live?`;
    document.getElementById("mPet").innerText = currentPet.name;
    document.getElementById("mShelter").innerText = currentPet.shelter;
  </script>
</body>
</html>
